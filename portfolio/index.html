    <!--
      THESIS: the catalog is one car under printed vinyl; panels are the
      layout and the graphic breaks across the seams between them. It refuses
      the floating card grid this category ships by default.
      OWN-WORLD: painted bodywork in two printings (pearl, midnight), three
      vinyl colours only (red, teal, amber), separation always a seam showing
      the dark structure beneath, every graphic sheared to one angle, a clear
      coat whose gloss band travels a panel on hover.
      STORY: a visitor sent this link sees the whole grid at once, reads one
      true fact per car, and opens one in a click. Sealed client previews stay
      shut until a password derives their address.
      FIRST VIEWPORT: the hood — number roundel on bare paint, the wordmark cut
      by real panel seams on the deck's own column rhythm, one bare panel left
      empty; the sponsor sill below it; then the deck, led by a 2x2 panel whose
      cover is the paint and whose caption is its own strip of bodywork.
      FORM: itasha printed vinyl wrap — a dealt challenger in the bolder
      re-roll, chosen by the user over every alternate; seed da13c077.
      FINISH: unreviewed and undocumented is unfinished; this build ends with
      the finish review, the verdict, and DESIGN.md.
    -->
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
